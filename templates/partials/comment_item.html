<div style="padding:.85rem;border-radius:6px;margin-bottom:.75rem;
  {% if comment.is_internal %}
  background:rgba(245,158,11,.05);border:1px solid rgba(245,158,11,.25);
  {% else %}
  background:rgba(79,142,247,.03);border:1px solid var(--itsm-border);
  {% endif %}">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;">
    <div style="font-size:.8rem;font-weight:600;">
      <i class="bi bi-person-circle me-1"></i>
      {{ comment.author.get_full_name|default:comment.author.username }}
      {% if comment.is_internal %}
      <span style="font-size:.7rem;color:var(--itsm-warning);margin-left:.4rem;">
        <i class="bi bi-lock-fill"></i> Nota interna
      </span>
      {% endif %}
    </div>
    <span style="font-size:.72rem;color:var(--itsm-muted);">{{ comment.created_at|date:"d/m/Y H:i" }}</span>
  </div>
  <p style="margin:0;font-size:.875rem;line-height:1.65;white-space:pre-wrap;">{{ comment.content }}</p>
</div>
